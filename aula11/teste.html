<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nacionalidade</title>
</head>
<body>
    <h1>nacionalidade</h1>
    digite o país: <input type="text" name="txtpais" id="txtpais">
    <input type="button" value="verificar" onclick="verificar()">
    <div id="res">

    </div>  

    <script>
        function verificar() {
            var txtp = window.document.querySelector('input#txtpais')
            var res = window.document.querySelector('div#res')
            var pais = txtp.value
            res.innerHTML = `<p>Você digitou ${pais}</p>`
            if (pais == 'Brasil') {
                res.innerHTML += `<p>Você é brasileiro(a)</p>`
            } else {
                res.innerHTML += `<p>Você é estrangeiro(a)</p>`
            }
        }
    </script>
</body>
</html>
